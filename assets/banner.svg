<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Hassan Hamdan, Applied AI Engineer. The model extracts. The code decides.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#1e2a44"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="flow" d="M 640 170 L 760 170 L 880 170 L 1000 170 L 1110 170"/>
  </defs>

  <rect width="1200" height="340" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="22" fill="url(#grid)"/>

  <!-- left: identity -->
  <g font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="64" y="118" font-size="54" font-weight="700" fill="#f1f5f9">Hassan Hamdan</text>
    <rect x="66" y="138" width="120" height="4" rx="2" fill="url(#accent)"/>
    <text x="64" y="184" font-size="24" fill="#cbd5e1">Applied AI Engineer · Mechatronics Engineer</text>
    <text x="64" y="216" font-size="17" fill="#94a3b8">LLM agents · Document AI · Automation that survives production</text>
    <text x="64" y="282" font-size="20" font-family="Consolas, Menlo, monospace" fill="#34d399">&gt; the model extracts. the code decides.<tspan fill="#34d399"><animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>▍</tspan></text>
  </g>

  <!-- right: the pipeline -->
  <g font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle">
    <use href="#flow" stroke="#24324f" stroke-width="3" fill="none"/>
    <use href="#flow" stroke="url(#accent)" stroke-width="3" fill="none" stroke-dasharray="10 14">
      <animate attributeName="stroke-dashoffset" from="48" to="0" dur="1.2s" repeatCount="indefinite"/>
    </use>

    <!-- travelling packet -->
    <circle r="6" fill="#f8fafc" filter="url(#glow)">
      <animateMotion dur="4s" repeatCount="indefinite" keyPoints="0;0.2;0.25;0.45;0.5;0.7;0.75;1" keyTimes="0;0.15;0.25;0.4;0.5;0.65;0.75;1" calcMode="linear">
        <mpath href="#flow"/>
      </animateMotion>
    </circle>

    <!-- nodes -->
    <g>
      <rect x="590" y="132" width="100" height="76" rx="14" fill="#0f172a" stroke="#334155"/>
      <text x="640" y="166" fill="#e2e8f0" font-weight="600">messy</text>
      <text x="640" y="186" fill="#94a3b8">input</text>
    </g>
    <g>
      <rect x="710" y="132" width="100" height="76" rx="14" fill="#0f172a" stroke="#38bdf8"/>
      <text x="760" y="166" fill="#e2e8f0" font-weight="600">LLM</text>
      <text x="760" y="186" fill="#94a3b8">extracts</text>
    </g>
    <g>
      <rect x="830" y="132" width="100" height="76" rx="14" fill="#0f172a" stroke="#34d399"/>
      <text x="880" y="166" fill="#e2e8f0" font-weight="600">rules</text>
      <text x="880" y="186" fill="#94a3b8">validate</text>
    </g>
    <g>
      <rect x="950" y="132" width="100" height="76" rx="14" fill="#0f172a" stroke="#fbbf24"/>
      <text x="1000" y="166" fill="#e2e8f0" font-weight="600">human</text>
      <text x="1000" y="186" fill="#94a3b8">if unsure</text>
    </g>
    <circle cx="1110" cy="170" r="22" fill="#052e2b" stroke="#34d399" stroke-width="2"/>
    <path d="M1100 171 l7 7 l14 -15" stroke="#34d399" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1110" y="222" fill="#94a3b8">done</text>


    <text x="850" y="268" fill="#64748b" font-size="13">every write is validated, verified, or sent to a person</text>
  </g>
</svg>
